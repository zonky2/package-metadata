de:
    title: Debug-Marker für Twig-Templates
    description: >
        Die klassischen .html5-Vorlagen von Contao umgeben ihre Ausgabe im Debug-Modus mit einem
        Kommentar, der Anfang und Ende der jeweiligen Vorlage markiert, damit im Quelltext sofort
        zu sehen ist, welche Vorlage welches Stück HTML erzeugt hat. Übernimmt ein gleichnamiges
        Twig-Template den Vorrang, fehlt dieser Kommentar. Diese Erweiterung schließt genau diese
        Lücke, ohne Contao selbst zu verändern.

        Wirksam ist sie nur im Debug-Modus und nur für Twig-Templates, die Contao selbst unter
        einem festen Namen lädt, also Content-Elemente, Module und alte Vorlagen, die durch ein
        Twig-Template ersetzt wurden. Außerhalb des Debug-Modus tut die Erweiterung nichts, die
        Ausgabe bleibt unverändert.
    keywords:
        - contao
        - twig
        - debug
        - template
        - e-spin
